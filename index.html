<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #00d084;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .dashboards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .dashboard-card {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            border: 1px solid #00d08433;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            border-color: #00d084;
            box-shadow: 0 0 20px rgba(0, 208, 132, 0.2);
        }

        .card-icon {
            font-size: 48px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #00d084;
        }

        .card-description {
            font-size: 14px;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .card-status {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dashboard Hub</h1>
            <p>Explore different data dashboards</p>
        </div>

        <div class="dashboards-grid">
            <a href="./dashboards/chess-champions.html" class="dashboard-card">
                <div class="card-icon">♔</div>
                <div class="card-title">Chess Champions</div>
                <div class="card-description">Current world chess champions across different categories</div>
                <div class="card-status">Active</div>
            </a>
            <a href="./dashboards/diablo4-builds.html" class="dashboard-card">
                <div class="card-icon">⚔️</div>
                <div class="card-title">Diablo 4 Builds</div>
                <div class="card-description">Curated D4 builds by class and difficulty level</div>
                <div class="card-status">New</div>
            </a>
        </div>
    </div>
</body>
</html>
