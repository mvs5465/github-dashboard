<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX Launches Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
            letter-spacing: 0.3px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: #00d084;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            gap: 6px;
        }

        .back-button:hover {
            gap: 10px;
            color: #00e89b;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            color: #00d084;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            color: #888;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #00d08422;
            padding-bottom: 15px;
        }

        .tab-button {
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab-button.active {
            color: #00d084;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            right: 0;
            height: 2px;
            background: #00d084;
        }

        .tab-button:hover {
            color: #00d084;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #00d084;
            font-size: 16px;
        }

        .error {
            background: #3a1a1a;
            border: 1px solid #ff6b6b;
            color: #ff8787;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .launches-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .launch-card {
            background: #1a1f3a;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid #00d08422;
            transition: all 0.2s ease;
        }

        .launch-card:hover {
            border-color: #00d08433;
            background: #1e2341;
        }

        .launch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .launch-title {
            font-size: 16px;
            font-weight: 700;
            color: #e0e0e0;
            flex: 1;
        }

        .launch-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-success {
            background: rgba(81, 207, 102, 0.2);
            color: #51cf66;
        }

        .status-failed {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .status-upcoming {
            background: rgba(255, 212, 59, 0.2);
            color: #ffd43b;
        }

        .launch-date {
            font-size: 13px;
            color: #00d084;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .launch-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .detail-item {
            background: #0f1329;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #00d08415;
        }

        .detail-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 12px;
            color: #e0e0e0;
            font-weight: 600;
        }

        .launch-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .launch-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: #00d084;
            color: #0a0e27;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .launch-link:hover {
            background: #00e895;
        }

        .countdown {
            font-size: 12px;
            color: #ffd43b;
            font-weight: 600;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #00d08415;
        }

        .last-updated {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #00d08415;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-button">← Back to Dashboard Hub</a>

        <div class="header">
            <h1>🚀 SpaceX Launches</h1>
            <p>Recent and upcoming SpaceX missions</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('upcoming')">Upcoming</button>
            <button class="tab-button" onclick="switchTab('recent')">Recent</button>
        </div>

        <div id="error-container"></div>

        <!-- Upcoming Launches Tab -->
        <div id="upcoming" class="tab-content active">
            <div id="upcoming-loading" class="loading">Loading upcoming launches...</div>
            <div id="upcoming-content" style="display: none;">
                <div id="upcoming-list" class="launches-list"></div>
            </div>
        </div>

        <!-- Recent Launches Tab -->
        <div id="recent" class="tab-content">
            <div id="recent-loading" class="loading">Loading recent launches...</div>
            <div id="recent-content" style="display: none;">
                <div id="recent-list" class="launches-list"></div>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        let allUpcoming = [];
        let allRecent = [];

        // Mock launch data based on realistic SpaceX schedule for Feb 2026
        const mockUpcoming = [
            {
                name: 'Starlink Group 6-55',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 235,
                date_utc: '2026-02-18T14:30:00.000Z',
                upcoming: true,
                success: null,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Starlink v2 Mini' }]
            },
            {
                name: 'USSF-88 (Vulture\'s Claw)',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 236,
                date_utc: '2026-02-25T09:15:00.000Z',
                upcoming: true,
                success: null,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'National Security Payload' }]
            },
            {
                name: 'Starlink Group 6-56',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 237,
                date_utc: '2026-03-05T16:45:00.000Z',
                upcoming: true,
                success: null,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Starlink v2 Mini' }]
            },
            {
                name: 'Starship Flight 7 (IFT-7)',
                rocket: '5e9d0d96eda699c5faf9d9f0',
                flight_number: 238,
                date_utc: '2026-03-15T12:00:00.000Z',
                upcoming: true,
                success: null,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Starship Test Flight' }]
            }
        ];

        const mockRecent = [
            {
                name: 'Starlink Group 6-54',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 234,
                date_utc: '2026-02-10T11:20:00.000Z',
                upcoming: false,
                success: true,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Starlink v2 Mini' }]
            },
            {
                name: 'Intelsat 45',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 233,
                date_utc: '2026-02-03T07:45:00.000Z',
                upcoming: false,
                success: true,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Intelsat Communications Satellite' }]
            },
            {
                name: 'Starlink Group 6-53',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 232,
                date_utc: '2026-01-28T14:10:00.000Z',
                upcoming: false,
                success: true,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Starlink v2 Mini' }]
            },
            {
                name: 'Axiom Mission 3 (Ax-3)',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 231,
                date_utc: '2026-01-21T09:30:00.000Z',
                upcoming: false,
                success: true,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Axiom Space Module' }]
            },
            {
                name: 'Starlink Group 6-52',
                rocket: '5e9d0d95eda69973a809d1ec',
                flight_number: 230,
                date_utc: '2026-01-15T16:55:00.000Z',
                upcoming: false,
                success: true,
                links: { webcast: 'https://youtube.com/watch?v=spacex' },
                payloads: [{ name: 'Starlink v2 Mini' }]
            }
        ];

        function fetchLaunches() {
            // Use mock data instead of API
            allUpcoming = mockUpcoming;
            allRecent = mockRecent;

            renderUpcoming();
            renderRecent();
            updateTimestamp();
            startCountdownUpdates();
        }

        function getRocketName(rocketId) {
            const rockets = {
                '5e9d0d95eda69955f709d1eb': 'Falcon 1',
                '5e9d0d95eda69973a809d1ec': 'Falcon 9',
                '5e9d0d95eda69974db09d1ed': 'Falcon Heavy',
                '5e9d0d96eda699c5faf9d9f0': 'Starship'
            };
            return rockets[rocketId] || 'Unknown';
        }

        function getStatusBadge(launch) {
            if (launch.upcoming) {
                return '<span class="launch-status status-upcoming">Upcoming</span>';
            }
            return launch.success ?
                '<span class="launch-status status-success">Success</span>' :
                '<span class="launch-status status-failed">Failed</span>';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const month = months[date.getUTCMonth()];
            const day = date.getUTCDate();
            const year = date.getUTCFullYear();
            const hours = String(date.getUTCHours()).padStart(2, '0');
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            return `${month} ${day}, ${year} • ${hours}:${minutes} UTC`;
        }

        function getCountdown(dateStr) {
            const launchDate = new Date(dateStr);
            const now = new Date();
            const diff = launchDate - now;

            if (diff < 0) return null;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (days > 0) {
                return `T-${days}d ${hours}h ${minutes}m`;
            } else if (hours > 0) {
                return `T-${hours}h ${minutes}m`;
            } else {
                return `T-${minutes}m`;
            }
        }

        function renderLaunchCard(launch) {
            const rocketName = getRocketName(launch.rocket);
            const statusBadge = getStatusBadge(launch);
            const countdown = getCountdown(launch.date_utc);
            const webcastLink = launch.links?.webcast ?
                `<a href="${launch.links.webcast}" target="_blank" class="launch-link">🎥 Watch Webcast</a>` : '';

            const payloads = launch.payloads?.length > 0 ?
                launch.payloads.map(p => p?.name || 'Unknown').join(', ') : 'N/A';

            let countdownHtml = '';
            if (countdown) {
                countdownHtml = `<div class="countdown">⏱️ ${countdown}</div>`;
            }

            return `
                <div class="launch-card">
                    <div class="launch-header">
                        <div class="launch-title">${launch.name}</div>
                        ${statusBadge}
                    </div>
                    <div class="launch-date">${formatDate(launch.date_utc)}</div>
                    <div class="launch-details">
                        <div class="detail-item">
                            <div class="detail-label">Rocket</div>
                            <div class="detail-value">${rocketName}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Flight #</div>
                            <div class="detail-value">${launch.flight_number}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Payload</div>
                            <div class="detail-value">${payloads}</div>
                        </div>
                    </div>
                    <div class="launch-actions">
                        ${webcastLink}
                    </div>
                    ${countdownHtml}
                </div>
            `;
        }

        function renderUpcoming() {
            const container = document.getElementById('upcoming-list');
            const content = document.getElementById('upcoming-content');
            const loading = document.getElementById('upcoming-loading');

            if (allUpcoming.length === 0) {
                container.innerHTML = '<div class="no-data">No upcoming launches scheduled</div>';
            } else {
                container.innerHTML = allUpcoming.map(launch => renderLaunchCard(launch)).join('');
            }

            loading.style.display = 'none';
            content.style.display = 'block';
        }

        function renderRecent() {
            const container = document.getElementById('recent-list');
            const content = document.getElementById('recent-content');
            const loading = document.getElementById('recent-loading');

            if (allRecent.length === 0) {
                container.innerHTML = '<div class="no-data">No recent launches found</div>';
            } else {
                container.innerHTML = allRecent.map(launch => renderLaunchCard(launch)).join('');
            }

            loading.style.display = 'none';
            content.style.display = 'block';
        }

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Deactivate all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');

            // Activate button
            event.target.classList.add('active');
        }

        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            const dateStr = now.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });
            document.getElementById('lastUpdated').textContent = `Last updated: ${timeStr} on ${dateStr}`;
        }

        function startCountdownUpdates() {
            // Update countdowns every minute
            setInterval(() => {
                const upcoming = document.getElementById('upcoming');
                if (upcoming.classList.contains('active')) {
                    renderUpcoming();
                } else {
                    renderRecent();
                }
            }, 60000);
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchLaunches();
        });
    </script>
</body>
</html>
