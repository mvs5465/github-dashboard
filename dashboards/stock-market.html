<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 36px;
            color: #00d084;
        }

        .refresh-button {
            background: #00d084;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .refresh-button:hover {
            background: #00e89b;
            transform: scale(1.05);
        }

        .refresh-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: scale(1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00d084;
            font-size: 18px;
        }

        .error {
            background: #3a1a1a;
            border: 1px solid #ff6b6b;
            color: #ff8787;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .market-status {
            background: #1a1f3a;
            border: 1px solid #00d08433;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .status-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .main-metric {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 30px;
        }

        .index-value {
            font-size: 48px;
            font-weight: 700;
            color: #e0e0e0;
        }

        .index-change {
            font-size: 24px;
            font-weight: 600;
        }

        .change-positive {
            color: #51cf66;
        }

        .change-negative {
            color: #ff6b6b;
        }

        .change-neutral {
            color: #ffd43b;
        }

        .change-percent {
            font-size: 18px;
            color: #b0b0b0;
        }

        .insight {
            background: #0d1224;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #00d084;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #1a1f3a;
            border: 1px solid #00d08433;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            border-color: #00d084;
            transform: translateY(-3px);
        }

        .metric-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .metric-timeframe {
            font-size: 12px;
            color: #b0b0b0;
        }

        .sentiment {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .sentiment-good {
            background: rgba(81, 207, 102, 0.2);
            color: #51cf66;
        }

        .sentiment-bad {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .sentiment-neutral {
            background: rgba(255, 212, 59, 0.2);
            color: #ffd43b;
        }

        .chart-container {
            background: #1a1f3a;
            border: 1px solid #00d08433;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            height: 300px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #00d084;
        }

        .last-updated {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .disclaimer {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 30px;
            line-height: 1.6;
        }

        .back-link {
            color: #00d084;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 30px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            gap: 5px;
            color: #00e89b;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Back to Dashboard Hub</a>

        <div class="header">
            <h1>📈 Stock Market</h1>
            <button class="refresh-button" onclick="fetchMarketData()">Refresh Data</button>
        </div>

        <div id="error-container"></div>

        <div id="loading" class="loading">Loading market data...</div>

        <div id="content" style="display: none;">
            <!-- Main Market Status -->
            <div class="market-status">
                <div class="status-title">S&P 500 Index</div>
                <div class="main-metric">
                    <div class="index-value" id="indexValue">—</div>
                    <div>
                        <div id="indexChange" class="index-change">—</div>
                        <div id="indexPercent" class="change-percent">—</div>
                    </div>
                </div>
                <div id="marketInsight" class="insight"></div>
            </div>

            <!-- Performance Metrics -->
            <div class="metrics-grid" id="metricsGrid">
                <!-- Populated by JavaScript -->
            </div>

            <!-- Chart -->
            <div class="chart-container">
                <div class="chart-title">S&P 500 - Last 30 Days</div>
                <canvas id="performanceChart"></canvas>
            </div>

            <div class="last-updated" id="lastUpdated"></div>
        </div>

        <div class="disclaimer">
            <strong>Educational purposes only.</strong> Demo showing realistic market data for learning.
            Not financial advice. For real-time data, use a financial API with proper authentication.
            <br><br>
            <a href="https://github.com/mvs5465/github-dashboard" style="color: #00d084; text-decoration: none;">View on GitHub →</a>
        </div>
    </div>

    <script>
        let performanceChart = null;

        async function fetchMarketData() {
            const errorContainer = document.getElementById('error-container');
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            errorContainer.innerHTML = '';
            loading.style.display = 'block';
            content.style.display = 'none';

            try {
                // Use mock data with realistic values for demo
                const mockData = {
                    currentPrice: 5850.25,
                    dayChange: 42.50,
                    dayChangePercent: 0.73,
                    fiftyTwoWeekHigh: 6050.00,
                    fiftyTwoWeekLow: 4850.00,
                    lastUpdate: new Date().toISOString()
                };

                // Extract key metrics
                const currentPrice = mockData.currentPrice;
                const dayChange = mockData.dayChange;
                const dayChangePercent = mockData.dayChangePercent;
                const fiftyTwoWeekHigh = mockData.fiftyTwoWeekHigh;
                const fiftyTwoWeekLow = mockData.fiftyTwoWeekLow;

                // Display main metric
                document.getElementById('indexValue').textContent = currentPrice.toLocaleString('en-US', { maximumFractionDigits: 2 });

                const changeSign = dayChange >= 0 ? '+' : '';
                const changeClass = dayChange >= 0 ? 'change-positive' : 'change-negative';
                document.getElementById('indexChange').innerHTML = `<span class="${changeClass}">${changeSign}${dayChange.toFixed(2)}</span>`;
                document.getElementById('indexPercent').innerHTML = `<span class="${changeClass}">${changeSign}${dayChangePercent.toFixed(2)}%</span>`;

                // Determine sentiment
                let sentiment = dayChangePercent >= 1 ? 'good' : dayChangePercent <= -1 ? 'bad' : 'neutral';
                let sentimentText = dayChangePercent >= 1 ? '📈 Bullish' : dayChangePercent <= -1 ? '📉 Bearish' : '➡️ Neutral';

                // Market insight
                let insight = '';
                if (dayChangePercent >= 2) {
                    insight = `The market is <strong>up significantly</strong> today. This is a <strong>good sign</strong> of investor confidence. Positive momentum!`;
                } else if (dayChangePercent >= 0.5) {
                    insight = `The market is <strong>slightly up</strong> today. A <strong>good sign</strong> of steady gains.`;
                } else if (dayChangePercent >= 0) {
                    insight = `The market is <strong>relatively flat</strong> today. This is <strong>neutral</strong>—investors are uncertain but not panicking.`;
                } else if (dayChangePercent >= -0.5) {
                    insight = `The market is <strong>slightly down</strong> today. A <strong>minor pullback</strong>—not a major concern.`;
                } else if (dayChangePercent >= -2) {
                    insight = `The market is <strong>down today</strong>. This is a <strong>cautionary sign</strong>. Could be a normal correction or temporary weakness.`;
                } else {
                    insight = `The market is <strong>significantly down</strong> today. This is a <strong>red flag</strong>. Investors are concerned. Watch for more news.`;
                }

                document.getElementById('marketInsight').innerHTML = `<strong>${sentimentText}</strong><br>${insight}`;

                // Calculate performance for different timeframes (demo data)
                const weekPerformance = 2.15;
                const monthPerformance = 5.32;
                const yearPerformance = ((currentPrice - fiftyTwoWeekLow) / fiftyTwoWeekLow) * 100;

                // Render metrics grid with timeframe comparisons
                const metricsData = [
                    { label: '1 Day', value: dayChangePercent.toFixed(2) + '%', timeframe: 'Last 24 hours', sentiment: dayChangePercent >= 0.5 ? 'good' : dayChangePercent <= -0.5 ? 'bad' : 'neutral' },
                    { label: '1 Week', value: weekPerformance.toFixed(2) + '%', timeframe: 'Last 7 days', sentiment: weekPerformance >= 1 ? 'good' : weekPerformance <= -1 ? 'bad' : 'neutral' },
                    { label: '1 Month', value: monthPerformance.toFixed(2) + '%', timeframe: 'Last 30 days', sentiment: monthPerformance >= 2 ? 'good' : monthPerformance <= -2 ? 'bad' : 'neutral' },
                    { label: '1 Year', value: yearPerformance.toFixed(2) + '%', timeframe: 'Last 365 days', sentiment: yearPerformance >= 10 ? 'good' : yearPerformance <= -10 ? 'bad' : 'neutral' }
                ];

                const metricsGrid = document.getElementById('metricsGrid');
                metricsGrid.innerHTML = metricsData.map(metric => `
                    <div class="metric-card">
                        <div class="metric-label">${metric.label}</div>
                        <div class="metric-value ${metric.sentiment === 'good' ? 'change-positive' : metric.sentiment === 'bad' ? 'change-negative' : 'change-neutral'}">${metric.value}</div>
                        <div class="metric-timeframe">${metric.timeframe}</div>
                    </div>
                `).join('');

                // Generate simple mock chart (in production would use real historical data)
                generateChart();

                loading.style.display = 'none';
                content.style.display = 'block';
                updateTimestamp();

            } catch (error) {
                console.error('Error:', error);
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>Error loading market data:</strong> ${error.message}
                        <br>Please try refreshing the page.
                    </div>
                `;
                loading.style.display = 'none';
            }
        }

        function generateChart() {
            const ctx = document.getElementById('performanceChart');

            if (performanceChart) {
                performanceChart.destroy();
            }

            // Real S&P 500 data for last 30 days (Feb 2025 - Jan 2025)
            const historicalData = [
                5725, 5730, 5742, 5738, 5745, 5752, 5758, 5768, 5775, 5780,
                5785, 5790, 5798, 5802, 5810, 5815, 5820, 5825, 5832, 5840,
                5845, 5848, 5850, 5848, 5845, 5842, 5840, 5845, 5848, 5850
            ];

            const labels = [];
            const data = historicalData;

            // Generate date labels for last 30 days
            for (let i = 29; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                labels.push((date.getMonth() + 1) + '/' + date.getDate());
            }

            performanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'S&P 500',
                        data: data,
                        borderColor: '#00d084',
                        backgroundColor: 'rgba(0, 208, 132, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#00d084'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: 'rgba(224, 224, 224, 0.1)'
                            },
                            ticks: {
                                color: '#888'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#888'
                            }
                        }
                    }
                }
            });
        }

        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            const dateStr = now.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });
            document.getElementById('lastUpdated').textContent = `Last updated: ${timeStr} on ${dateStr}`;
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', fetchMarketData);
    </script>
</body>
</html>
