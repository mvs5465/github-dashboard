<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
            letter-spacing: 0.3px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: #00d084;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            gap: 6px;
        }

        .back-button:hover {
            gap: 10px;
            color: #00e89b;
        }

        .search-box {
            background: #1a1f3a;
            border-radius: 10px;
            padding: 24px;
            border: 1px solid #00d08422;
            margin-bottom: 28px;
        }

        .search-input-group {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            background: #0f1329;
            border: 1px solid #00d08433;
            color: #e0e0e0;
            padding: 13px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00d084;
            box-shadow: 0 0 12px rgba(0, 208, 132, 0.15);
        }

        button {
            background: #00d084;
            color: #0a0e27;
            border: none;
            padding: 13px 28px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        button:hover {
            background: #00e895;
        }

        button:active {
            transform: scale(0.98);
        }

        .weather-display {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 32px;
            border: 1px solid #00d08422;
            display: none;
        }

        .weather-display.show {
            display: block;
        }

        .weather-main {
            display: flex;
            gap: 48px;
            margin-bottom: 24px;
            align-items: flex-start;
        }

        .weather-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1.5;
            flex-shrink: 0;
            padding: 12px;
        }

        .location-name {
            font-size: 22px;
            font-weight: 600;
            color: #00d084;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .temp-section {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 14px;
        }

        .current-temp {
            font-size: 64px;
            font-weight: 700;
            color: #e0e0e0;
            line-height: 1;
        }

        .temp-unit {
            font-size: 32px;
            color: #888;
            font-weight: 500;
        }

        .condition {
            font-size: 15px;
            color: #b0b0b0;
            text-align: center;
            font-weight: 500;
        }

        .condition-icon {
            font-size: 60px;
            margin: 12px 0;
            filter: drop-shadow(0 2px 4px rgba(0, 208, 132, 0.1));
        }

        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
        }

        .weather-item {
            background: #0f1329;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #00d08415;
            transition: all 0.2s ease;
        }

        .weather-item:hover {
            border-color: #00d08433;
            background: #111833;
        }

        .weather-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .weather-value {
            font-size: 18px;
            font-weight: 700;
            color: #00d084;
            letter-spacing: 0.2px;
        }

        .forecast-section {
            margin-top: 20px;
            border-top: 1px solid #00d08433;
            padding-top: 15px;
        }

        .forecast-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .hourly-section {
            margin-top: 28px;
            border-top: 1px solid #00d08422;
            padding-top: 24px;
        }

        .hourly-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .hourly-row {
            background: #0f1329;
            border: 1px solid #00d08415;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 13px;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .hourly-row:hover {
            border-color: #00d08433;
            background: #111833;
        }

        .hourly-time-col {
            color: #666;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .hourly-icon-col {
            font-size: 32px;
        }

        .hourly-temp-col {
            color: #00d084;
            font-weight: 700;
            font-size: 18px;
        }

        .hourly-weather-col {
            color: #b0b0b0;
            font-size: 12px;
            font-weight: 500;
        }

        .forecast-section {
            margin-top: 28px;
            border-top: 1px solid #00d08422;
            padding-top: 24px;
        }

        .forecast-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .forecast-day {
            background: #0f1329;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #00d08415;
            text-align: center;
            transition: all 0.2s ease;
        }

        .forecast-day:hover {
            border-color: #00d08433;
            background: #111833;
        }

        .forecast-day-name {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .forecast-temp {
            font-size: 18px;
            font-weight: 700;
            color: #00d084;
        }

        .last-updated {
            font-size: 11px;
            color: #666;
            margin-top: 20px;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #00d08415;
        }

        .error {
            background: #5a2d2d;
            border: 1px solid #d87a7a;
            color: #ffb3b3;
            padding: 15px;
            border-radius: 8px;
            display: none;
            margin-top: 15px;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #888;
            margin-top: 15px;
        }

        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-button">← Back to Dashboards</a>

        <div class="search-box">
            <div class="search-input-group">
                <input type="text" id="zipInput" placeholder="Enter zip code" maxlength="10">
                <button onclick="fetchWeather()">Search</button>
            </div>
            <div id="error" class="error"></div>
            <div id="loading" class="loading">Loading weather...</div>
        </div>

        <div id="weatherDisplay" class="weather-display">
            <div class="weather-main">
                <div class="weather-left">
                    <div class="location-name" id="locationName"></div>
                    <div class="condition-icon" id="conditionIcon"></div>
                    <div class="temp-section">
                        <span class="current-temp" id="currentTemp"></span>
                        <span class="temp-unit">°F</span>
                    </div>
                    <div class="condition" id="condition"></div>
                </div>

                <div class="weather-grid">
                    <div class="weather-item">
                        <div class="weather-label">Feels Like</div>
                        <div class="weather-value" id="feelsLike"></div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-label">Humidity</div>
                        <div class="weather-value" id="humidity"></div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-label">Wind</div>
                        <div class="weather-value" id="wind"></div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-label">Dew Point</div>
                        <div class="weather-value" id="dewPoint"></div>
                    </div>
                </div>
            </div>

            <div class="hourly-section">
                <div class="forecast-title">Next 24 Hours</div>
                <div class="hourly-list" id="hourlyList"></div>
            </div>

            <div class="forecast-section">
                <div class="forecast-title">5-Day Forecast</div>
                <div class="forecast-grid" id="forecastGrid"></div>
            </div>

            <div class="last-updated" id="lastUpdated"></div>
        </div>
    </div>

    <script>
        const zipInput = document.getElementById('zipInput');

        zipInput.addEventListener('keyup', () => {
            if (zipInput.value.length === 5) {
                fetchWeather();
            }
        });

        zipInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchWeather();
        });

        async function fetchWeather() {
            const zip = zipInput.value.trim();
            if (!zip) {
                showError('Enter a zip code');
                return;
            }

            clearError();
            showLoading(true);

            try {
                // Get coordinates from zip code using zippopotam.us API
                const geoResponse = await fetch(
                    `https://api.zippopotam.us/us/${zip}`
                );
                const geoData = await geoResponse.json();

                if (geoData.error) {
                    showError('Zip code not found');
                    showLoading(false);
                    return;
                }

                const { places } = geoData;
                if (!places || places.length === 0) {
                    showError('Zip code not found');
                    showLoading(false);
                    return;
                }

                const place = places[0];
                const latitude = parseFloat(place.latitude);
                const longitude = parseFloat(place.longitude);
                const name = place['place name'];
                const admin1 = place['state abbreviation'];

                // Get weather data from Open-Meteo Weather API (includes hourly data)
                const weatherResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,dew_point_2m&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`
                );
                const weatherData = await weatherResponse.json();

                displayWeather(weatherData, name, admin1);
                showLoading(false);
            } catch (error) {
                showError('Failed to fetch weather data');
                showLoading(false);
            }
        }

        function displayWeather(data, name, state) {
            const current = data.current;
            const hourly = data.hourly;
            const daily = data.daily;
            const weatherDesc = getWeatherDescription(current.weather_code);

            document.getElementById('locationName').textContent = `${name}, ${state}`;
            document.getElementById('currentTemp').textContent = Math.round(current.temperature_2m);
            document.getElementById('conditionIcon').textContent = weatherDesc.icon;
            document.getElementById('condition').textContent = weatherDesc.text;
            document.getElementById('feelsLike').textContent = Math.round(current.apparent_temperature) + '°';
            document.getElementById('humidity').textContent = current.relative_humidity_2m + '%';
            document.getElementById('wind').textContent = Math.round(current.wind_speed_10m) + ' mph';
            document.getElementById('dewPoint').textContent = Math.round(current.dew_point_2m) + '°';

            // Build hourly forecast chart for next 24 hours
            if (hourly && hourly.time && hourly.temperature_2m) {
                const labels = [];
                const temps = [];
                const weatherCodes = [];

                for (let i = 0; i < 24 && i < hourly.time.length; i++) {
                    const timeStr = hourly.time[i];
                    const [date, time] = timeStr.split('T');
                    const [hour] = time.split(':');
                    const hourNum = parseInt(hour);
                    const hourDisplay = hourNum === 0 ? '12 AM' : hourNum < 12 ? `${hourNum} AM` : hourNum === 12 ? '12 PM' : `${hourNum - 12} PM`;
                    const temp = Math.round(hourly.temperature_2m[i]);
                    const weatherCode = hourly.weather_code[i];

                    labels.push(hourDisplay);
                    temps.push(temp);
                    weatherCodes.push(weatherCode);
                }

                buildHourlyChart(labels, temps, weatherCodes);
            }

            // Build 5-day forecast
            const forecastGrid = document.getElementById('forecastGrid');
            forecastGrid.innerHTML = '';

            for (let i = 1; i < 6 && i < daily.time.length; i++) {
                const dateStr = daily.time[i];
                const date = new Date(dateStr + 'T00:00');
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);

                const forecastDay = document.createElement('div');
                forecastDay.className = 'forecast-day';
                forecastDay.innerHTML = `
                    <div class="forecast-day-name">${dayName}</div>
                    <div style="font-size: 24px; margin: 8px 0;">☁️</div>
                    <div class="forecast-temp">${maxTemp}°</div>
                    <div style="font-size: 11px; color: #666; margin-top: 4px;">${minTemp}°</div>
                `;
                forecastGrid.appendChild(forecastDay);
            }

            document.getElementById('weatherDisplay').classList.add('show');
            updateTimestamp();
        }

        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            const dateStr = now.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });
            document.getElementById('lastUpdated').textContent = `Last updated: ${timeStr} on ${dateStr}`;
        }

        function buildHourlyChart(labels, temps, weatherCodes) {
            const hourlyList = document.getElementById('hourlyList');
            hourlyList.innerHTML = '';

            labels.forEach((label, index) => {
                // Only display every 3rd hour
                if (index % 3 !== 0) return;

                const temp = temps[index];
                const weatherCode = weatherCodes[index];
                const weatherDesc = getWeatherDescription(weatherCode);

                const row = document.createElement('div');
                row.className = 'hourly-row';
                row.innerHTML = `
                    <div class="hourly-time-col">${label}</div>
                    <div class="hourly-icon-col">${weatherDesc.icon}</div>
                    <div class="hourly-temp-col">${temp}°F</div>
                    <div class="hourly-weather-col">${weatherDesc.text}</div>
                `;
                hourlyList.appendChild(row);
            });
        }

        function getWeatherDescription(code) {
            const descriptions = {
                0: { icon: '☀️', text: 'Clear' },
                1: { icon: '🌤️', text: 'Mostly Clear' },
                2: { icon: '⛅', text: 'Partly Cloudy' },
                3: { icon: '☁️', text: 'Overcast' },
                45: { icon: '🌫️', text: 'Foggy' },
                48: { icon: '🌫️', text: 'Foggy' },
                51: { icon: '🌧️', text: 'Light Drizzle' },
                53: { icon: '🌧️', text: 'Drizzle' },
                55: { icon: '🌧️', text: 'Heavy Drizzle' },
                61: { icon: '🌧️', text: 'Light Rain' },
                63: { icon: '🌧️', text: 'Rain' },
                65: { icon: '⛈️', text: 'Heavy Rain' },
                71: { icon: '❄️', text: 'Light Snow' },
                73: { icon: '❄️', text: 'Snow' },
                75: { icon: '❄️', text: 'Heavy Snow' },
                77: { icon: '❄️', text: 'Snow Grains' },
                80: { icon: '🌧️', text: 'Light Showers' },
                81: { icon: '🌧️', text: 'Showers' },
                82: { icon: '⛈️', text: 'Heavy Showers' },
                85: { icon: '❄️', text: 'Light Snow Showers' },
                86: { icon: '❄️', text: 'Snow Showers' },
                95: { icon: '⛈️', text: 'Thunderstorm' },
                96: { icon: '⛈️', text: 'Thunderstorm with Hail' },
                99: { icon: '⛈️', text: 'Thunderstorm with Hail' }
            };
            const result = descriptions[code] || { icon: '❓', text: 'Unknown' };
            return result;
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = msg;
            error.classList.add('show');
        }

        function clearError() {
            document.getElementById('error').classList.remove('show');
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        // Load saved zip on page load
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('lastZip');
            if (saved) {
                zipInput.value = saved;
                fetchWeather();
            }
        });

        // Save zip on successful fetch
        const originalFetch = fetchWeather;
        window.fetchWeather = function() {
            originalFetch.call(this);
            localStorage.setItem('lastZip', zipInput.value);
        };
    </script>
</body>
</html>
