<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diablo 4 Builds Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #00d08433;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #00d084;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: transparent;
            color: #00d084;
            text-decoration: none;
            border: 1px solid #00d08433;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            border-color: #00d084;
            box-shadow: 0 0 10px rgba(0, 208, 132, 0.2);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            background: #1a1f3a;
            color: #e0e0e0;
            border: 1px solid #00d08433;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover,
        select:focus {
            border-color: #00d084;
            outline: none;
        }

        .builds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .build-card {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #00d08433;
            transition: all 0.3s ease;
        }

        .build-card:hover {
            border-color: #00d084;
            box-shadow: 0 0 20px rgba(0, 208, 132, 0.15);
            transform: translateY(-3px);
        }

        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            gap: 10px;
        }

        .build-title {
            font-size: 18px;
            font-weight: 600;
            color: #00d084;
        }

        .build-class {
            display: inline-block;
            background: #00d08433;
            color: #00d084;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #00d084;
            white-space: nowrap;
        }

        .build-difficulty {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .difficulty-starter {
            background: #2d5a2d;
            color: #7add7a;
            border: 1px solid #7add7a;
        }

        .difficulty-intermediate {
            background: #5a4a2d;
            color: #f0ad4e;
            border: 1px solid #f0ad4e;
        }

        .difficulty-endgame {
            background: #5a2d2d;
            color: #d87a7a;
            border: 1px solid #d87a7a;
        }

        .build-description {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .build-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .stat-item {
            background: #0f1329;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #00d08415;
        }

        .stat-label {
            color: #888;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            color: #00d084;
            font-weight: 600;
        }

        .build-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            background: #0f1329;
            border: 1px solid #00d08433;
            color: #b0b0b0;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        .content {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 40px;
            border: 1px solid #00d08433;
            text-align: center;
        }

        .placeholder {
            color: #999;
            font-size: 16px;
            line-height: 1.8;
        }

        .placeholder-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .last-updated {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-button">← Back to Dashboards</a>

        <div class="header">
            <h1>⚔️ Diablo 4 Builds</h1>
        </div>

        <div id="builds-container" style="display: none;">
            <div class="filters">
                <div class="filter-group">
                    <label>Class:</label>
                    <select id="classFilter">
                        <option value="">All Classes</option>
                        <option value="Barbarian">Barbarian</option>
                        <option value="Necromancer">Necromancer</option>
                        <option value="Sorcerer">Sorcerer</option>
                        <option value="Druid">Druid</option>
                        <option value="Rogue">Rogue</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Difficulty:</label>
                    <select id="difficultyFilter">
                        <option value="">All Difficulties</option>
                        <option value="Starter">Starter</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Endgame">Endgame</option>
                    </select>
                </div>
            </div>

            <div class="builds-grid" id="builds-grid"></div>
            <div class="last-updated" id="last-updated"></div>
        </div>

        <div id="loading" class="content">
            <div class="placeholder-icon">⚔️</div>
            <p class="placeholder">Loading builds data...</p>
        </div>
    </div>

    <script>
        let allBuilds = [];

        async function loadBuildsData() {
            try {
                const response = await fetch('../data/diablo4-builds.json');
                if (!response.ok) throw new Error('Failed to load data');

                const data = await response.json();
                allBuilds = data.builds;
                renderBuilds(allBuilds);
                document.getElementById('last-updated').textContent = `Last updated: ${new Date(data.last_updated).toLocaleDateString()}`;
            } catch (error) {
                document.getElementById('loading').innerHTML = `<div style="color: #d73a49;">Error loading data: ${error.message}</div>`;
            }
        }

        function renderBuilds(builds) {
            const grid = document.getElementById('builds-grid');
            grid.innerHTML = '';

            if (builds.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">No builds match your filters</div>';
                return;
            }

            builds.forEach(build => {
                const difficultyClass = `difficulty-${build.difficulty.toLowerCase()}`;
                const tagsHtml = build.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

                const card = document.createElement('div');
                card.className = 'build-card';
                card.innerHTML = `
                    <div class="build-header">
                        <div>
                            <div class="build-title">${build.name}</div>
                            <span class="build-class">${build.class}</span>
                        </div>
                        <span class="build-difficulty ${difficultyClass}">${build.difficulty}</span>
                    </div>
                    <p class="build-description">${build.description}</p>
                    <div class="build-stats">
                        <div class="stat-item">
                            <div class="stat-label">Focus</div>
                            <div class="stat-value">${build.focus}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Main Skill</div>
                            <div class="stat-value">${build.main_skill}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Cost</div>
                            <div class="stat-value">${build.cost}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Rating</div>
                            <div class="stat-value">${build.rating}/10</div>
                        </div>
                    </div>
                    <div class="build-tags">${tagsHtml}</div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('builds-container').style.display = 'block';
        }

        function filterBuilds() {
            const classFilter = document.getElementById('classFilter').value;
            const difficultyFilter = document.getElementById('difficultyFilter').value;

            const filtered = allBuilds.filter(build => {
                const matchClass = !classFilter || build.class === classFilter;
                const matchDifficulty = !difficultyFilter || build.difficulty === difficultyFilter;
                return matchClass && matchDifficulty;
            });

            renderBuilds(filtered);
        }

        document.getElementById('classFilter').addEventListener('change', filterBuilds);
        document.getElementById('difficultyFilter').addEventListener('change', filterBuilds);

        loadBuildsData();
    </script>
</body>
</html>
