name: Update Chess Champions Data

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 12 PM UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Fetch chess data
        run: python3 .github/scripts/fetch_chess_data.py

      - name: Validate data and HTML
        run: python3 .github/scripts/validate.py

      - name: Check if data changed
        id: check-changes
        run: |
          if git diff --quiet data/chess-champions.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: update chess champions data'
          title: 'chore: update chess champions ratings'
          body: 'Automated daily update of chess champions ratings from Chess.com API'
          branch: chess-data-update
          delete-branch: true

      - name: Enable auto-merge
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          gh pr merge --auto --squash --delete-branch $(gh pr list --author github-actions --state open --json number --jq '.[0].number')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
